name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch breakage from new Home Assistant / Marketplace rules.
    - cron: "0 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Remove once README.md contains a screenshot (needed for the default catalog).
          ignore: images

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q tests
